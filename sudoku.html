<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sudoku Web App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --fixed: #94a3b8;
      --conflict: #ef4444;
      --highlight: #334155;
      --selected: #0284c7;
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { margin-bottom: 16px; font-weight: 700; color: var(--accent); }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button, select {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover, select:hover { background: #334155; }
    .btn-primary { background: #0284c7; border-color: #0284c7; font-weight: 600; }
    .btn-primary:hover { background: #0369a1; }
    
    #board {
      display: grid;
      grid-template-columns: repeat(9, 44px);
      grid-template-rows: repeat(9, 44px);
      gap: 1px;
      background: #475569;
      border: 3px solid #64748b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .cell {
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    /* 3x3 Box borders */
    .cell:nth-child(3n) { border-right: 2px solid #64748b; }
    .cell:nth-child(9n) { border-right: none; }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #64748b; }

    .cell.fixed { color: var(--fixed); cursor: default; }
    .cell.selected { background: var(--selected) !important; color: #fff; }
    .cell.highlight { background: var(--highlight); }
    .cell.conflict { background: var(--conflict) !important; color: #fff; }

    .numpad {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .numpad button {
      width: 44px;
      height: 44px;
      font-size: 18px;
      font-weight: bold;
      padding: 0;
    }
    #status {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 500;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h1>Sudoku Interactive</h1>
  <div class="controls">
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn-primary" onclick="newGame()">New Game</button>
    <button onclick="checkSolution()">Check Solution</button>
    <button onclick="resetBoard()">Reset</button>
  </div>

  <div id="board"></div>

  <div class="numpad">
    <button onclick="inputDigit(1)">1</button>
    <button onclick="inputDigit(2)">2</button>
    <button onclick="inputDigit(3)">3</button>
    <button onclick="inputDigit(4)">4</button>
    <button onclick="inputDigit(5)">5</button>
    <button onclick="inputDigit(6)">6</button>
    <button onclick="inputDigit(7)">7</button>
    <button onclick="inputDigit(8)">8</button>
    <button onclick="inputDigit(9)">9</button>
    <button onclick="inputDigit(0)">⌫</button>
  </div>

  <div id="status"></div>

  <script>
    const puzzles = {
      easy: {
        clues: "530070000600195000098000060800060003400803001700020006060000280000419005000080079",
        solution: "534678912672195348198342567859761423426853791713924856961537284287419635345286179"
      },
      medium: {
        clues: "000260701680070090190004500820100040004602900050003028009300074040050036703018000",
        solution: "435269781682571493197834562826195347374682915951743628519326874248957136763418259"
      },
      hard: {
        clues: "020000600000001040008070005000009300090402010003500000700030800010600000005000090",
        solution: "124895637357261948968374125271983564896452713435617289749136852512648379683729451"
      }
    };

    let currentGrid = [];
    let initialClues = [];
    let selectedCell = null;

    function newGame() {
      const diff = document.getElementById('difficulty').value;
      const puzzle = puzzles[diff];
      initialClues = puzzle.clues.split('').map(Number);
      currentGrid = [...initialClues];
      selectedCell = null;
      document.getElementById('status').innerText = "";
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = "";
      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (initialClues[i] !== 0) {
          cell.classList.add('fixed');
          cell.innerText = initialClues[i];
        } else if (currentGrid[i] !== 0) {
          cell.innerText = currentGrid[i];
        }

        cell.onclick = () => selectCell(i);
        board.appendChild(cell);
      }
    }

    function selectCell(index) {
      selectedCell = index;
      document.querySelectorAll('.cell').forEach((c, idx) => {
        c.classList.remove('selected', 'highlight');
        if (idx === index) c.classList.add('selected');
        else if (Math.floor(idx / 9) === Math.floor(index / 9) || 
                 idx % 9 === index % 9) {
          c.classList.add('highlight');
        }
      });
    }

    function inputDigit(digit) {
      if (selectedCell === null || initialClues[selectedCell] !== 0) return;
      currentGrid[selectedCell] = digit;
      const cell = document.getElementById('board').children[selectedCell];
      cell.innerText = digit === 0 ? '' : digit;
      checkConflicts();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '9') inputDigit(parseInt(e.key));
      else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') inputDigit(0);
      else if (e.key === 'ArrowUp' && selectedCell >= 9) selectCell(selectedCell - 9);
      else if (e.key === 'ArrowDown' && selectedCell <= 71) selectCell(selectedCell + 9);
      else if (e.key === 'ArrowLeft' && selectedCell % 9 > 0) selectCell(selectedCell - 1);
      else if (e.key === 'ArrowRight' && selectedCell % 9 < 8) selectCell(selectedCell + 1);
    });

    function checkConflicts() {
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('conflict'));
      for (let i = 0; i < 81; i++) {
        const val = currentGrid[i];
        if (val === 0) continue;
        const row = Math.floor(i / 9);
        const col = i % 9;
        const boxR = Math.floor(row / 3) * 3;
        const boxC = Math.floor(col / 3) * 3;

        for (let j = 0; j < 81; j++) {
          if (i === j) continue;
          const r = Math.floor(j / 9);
          const c = j % 9;
          if ((r === row || c === col || (r >= boxR && r < boxR + 3 && c >= boxC && c < boxC + 3)) && currentGrid[j] === val) {
            document.getElementById('board').children[i].classList.add('conflict');
            document.getElementById('board').children[j].classList.add('conflict');
          }
        }
      }
    }

    function checkSolution() {
      const diff = document.getElementById('difficulty').value;
      const sol = puzzles[diff].solution;
      const current = currentGrid.join('');
      const status = document.getElementById('status');
      
      if (current.includes('0')) {
        status.innerText = "Grid is incomplete. Keep going!";
        status.style.color = "#f59e0b";
      } else if (current === sol) {
        status.innerText = "Congratulations! Puzzle solved perfectly!";
        status.style.color = "#10b981";
      } else {
        status.innerText = "There are errors on the grid. Check highlighted cells.";
        status.style.color = "#ef4444";
      }
    }

    function resetBoard() {
      currentGrid = [...initialClues];
      selectedCell = null;
      renderBoard();
      document.getElementById('status').innerText = "";
    }

    newGame();
  </script>
</body>
</html>
